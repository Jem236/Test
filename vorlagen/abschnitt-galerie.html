<section class="abschnitt {{ bg }}"{% if a.anker %} id="{{ a.anker }}"{% endif %}>
  <div class="wrap">
    {% if a.titel %}<h2>{{ a.titel }}</h2>{% endif %}
    <div class="raster klein galerie{% if a.stil == 'historisch' %} historisch{% endif %}">
    {% for b in a.bilder %}
      <figure>{{ b.datei | bild(b.alt or b.text) }}{% if b.text %}<figcaption>{{ b.text }}</figcaption>{% endif %}</figure>
    {% endfor %}
    </div>
  </div>
</section>
