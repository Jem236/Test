titel: Harzlich willkommen in Scharzfeld
seitentitel: Scharzfeld im Südharz – Natur erleben | Verkehrsverein Scharzfeld
beschreibung: >-
  Scharzfeld im Südharz: Burgruine Scharzfels, Einhornhöhle, Steinkirche, Wandern auf dem
  Harzer Baudensteig, Waldschwimmbad und Unterkünfte für Ihren Urlaub im Harz.
menu: Start
reihenfolge: 1
banner: banner-scharzfeld.jpg
untertitel: Natur erleben am Südrand des Harzes – zwischen Burgruine, Einhornhöhle und Steinkirche.

